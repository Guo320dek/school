[build]
  builder = "nixpacks"
  buildCommand = "echo 'Build skipped - dist committed'"

[deploy]
  startCommand = "node server/index.cjs"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"

[service]
  [service.volume]
    name = "data"
    mountPath = "/data"
